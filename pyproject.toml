[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffcsp"
version = "0.2.0"
description = "DiffCSP++: Crystal Structure Prediction via Space Group Constrained Diffusion with MLIP Backbone"
readme = "README.md"
authors = [{ name = "Nikita Kazeev", email = "kazeevn@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pymatgen>=2023.0.0",
    "pyxtal>=1.0.6",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
orb = [
    "orb-models>=0.5.0",
    "ase>=3.22.0",
]
wandb = [
    "wandb>=0.16.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
# CSP benchmarks (bench/mlip_relax.py, bench/evaluate_csp.py): WyckoffTransformer's
# relaxer, MLIP registry and LeMat-Bulk hulls, and UPET for PET-OAM-XL. On zeus,
# UPET's Torch-ABI dependencies (metatomic-torch, metatensor-torch) resolve from
# the local wheel index in uv.toml.
csp-bench = [
    "wyckoff-transformer",
    "orb-models>=0.5.1",
    "ase>=3.23",
    "upet>=0.3.1",
]

[project.scripts]
diffcsp-train = "diffcsp.cli.train:main"
diffcsp-inference = "diffcsp.cli.inference:main"

[tool.hatch.build.targets.wheel]
packages = ["diffcsp"]

[tool.uv]
override-dependencies = [
    "dm-tree>=0.1.10",
]

[tool.uv.sources]
# upet 0.3.1 needs nvalchemi-toolkit-ops>=0.4, which orb-models 0.7.0 (the latest
# release) excludes; master allows it from this commit on. Its checkpoint URLs
# are those of 0.7.0, so ORB energies still match the LeMat-Bulk orb_conserv_inf
# hull. Return to a release once one includes it. The installed package reports
# version 0.3.2.dev0: orb-models stamps the real version only at release time.
orb-models = { git = "https://github.com/orbital-materials/orb-models", rev = "1794f852543600d1611d2a3728a95142574f5dc2" }
wyckoff-transformer = { path = "../WyckoffTransformer", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without explicit strict parameter
]

[tool.ruff.lint.isort]
known-first-party = ["diffcsp"]
